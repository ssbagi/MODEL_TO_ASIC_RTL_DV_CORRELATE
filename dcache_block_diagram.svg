<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <style>
    .box { fill: #f8f9fa; stroke: #333; stroke-width: 1.5px; }
    .sub { fill: #fff; stroke: #444; stroke-width: 1px; }
    .title { font: 16px sans-serif; font-weight: bold; }
    .label { font: 12px sans-serif; }
    .param { font: 11px sans-serif; fill: #333; }
    .arrow { stroke: #111; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111" />
    </marker>
  </defs>

  <!-- CPU block -->
  <rect x="30" y="60" width="220" height="120" class="box" rx="8" ry="8" />
  <text x="140" y="85" text-anchor="middle" class="title">CPU Interface</text>
  <text x="140" y="105" text-anchor="middle" class="label">req_valid, req_addr, req_wdata, req_we</text>
  <text x="140" y="125" text-anchor="middle" class="label">req_ready, resp_valid, resp_rdata, resp_hit</text>

  <!-- Memory block -->
  <rect x="750" y="220" width="200" height="120" class="box" rx="8" ry="8" />
  <text x="850" y="250" text-anchor="middle" class="title">Memory</text>
  <text x="850" y="270" text-anchor="middle" class="label">mem_req_*, mem_resp_*</text>

  <!-- Cache core group -->
  <rect x="300" y="40" width="420" height="420" class="box" rx="10" ry="10" />
  <text x="510" y="65" text-anchor="middle" class="title">Cache Core</text>

  <!-- Sub-blocks inside cache core -->
  <rect x="330" y="95" width="160" height="70" class="sub" rx="6" ry="6" />
  <text x="410" y="120" text-anchor="middle" class="label">Request Latch</text>
  <text x="410" y="136" text-anchor="middle" class="param">(single outstanding)</text>

  <rect x="510" y="95" width="180" height="70" class="sub" rx="6" ry="6" />
  <text x="600" y="120" text-anchor="middle" class="label">FSM</text>
  <text x="600" y="136" text-anchor="middle" class="param">S_IDLE, S_MISS, S_REFILL</text>

  <rect x="330" y="200" width="120" height="80" class="sub" rx="6" ry="6" />
  <text x="390" y="240" text-anchor="middle" class="label">Tag RAM</text>
  <text x="390" y="257" text-anchor="middle" class="param">TAG_W x NUM_LINES</text>

  <rect x="470" y="200" width="120" height="80" class="sub" rx="6" ry="6" />
  <text x="530" y="240" text-anchor="middle" class="label">Data RAM</text>
  <text x="530" y="257" text-anchor="middle" class="param">LINE_BITS x NUM_LINES</text>

  <rect x="610" y="200" width="120" height="80" class="sub" rx="6" ry="6" />
  <text x="670" y="240" text-anchor="middle" class="label">Valid / Dirty</text>
  <text x="670" y="257" text-anchor="middle" class="param">1-bit arrays</text>

  <!-- Arrows CPU -> Cache -->
  <path class="arrow" d="M250 120 L330 130" />
  <path class="arrow" d="M250 140 L330 160" />

  <!-- Internal arrows -->
  <path class="arrow" d="M410 165 L410 195" />
  <path class="arrow" d="M530 165 L530 195" />
  <path class="arrow" d="M690 165 L610 195" />

  <!-- Cache -> Memory -->
  <path class="arrow" d="M690 240 L750 240" />
  <path class="arrow" d="M750 260 L690 260" />

  <!-- Memory -> Cache -->
  <path class="arrow" d="M750 260 L690 320" />

  <!-- Cache to CPU response -->
  <path class="arrow" d="M410 95 L250 95" />

  <!-- labels for arrows -->
  <text x="500" y="220" class="label" text-anchor="middle">index/tag lookup</text>

  <!-- Legend / params -->
  <rect x="30" y="420" width="920" height="150" fill="#fff8e1" stroke="#d4b106" stroke-width="1.2" rx="6" ry="6"/>
  <text x="60" y="450" class="title">Parameters</text>
  <text x="60" y="475" class="param">ADDR_W = 32 &nbsp;&nbsp; LINE_BITS = 128 &nbsp;&nbsp; NUM_LINES = 64</text>
  <text x="60" y="495" class="param">INDEX_W = 6 &nbsp;&nbsp; OFFSET_W = 4 &nbsp;&nbsp; TAG_W = ADDR_W - INDEX_W - OFFSET_W</text>

</svg>